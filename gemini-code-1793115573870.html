            { id: '50', name: 'Make (Integromat)', category: 'office', desc: '强大的无代码自动化流程连接平台，支持将各种 AI 工具与你的日常软件无缝整合。', icon: 'fa-diagram-project', gradient: 'from-purple-600 to-fuchsia-800', pricing: '免费 / 订阅', url: 'https://www.make.com', badge: '自动化' }
        ];

        // 状态变量
        let currentCategory = 'all';
        let searchQuery = '';
        let favorites = JSON.parse(localStorage.getItem('ai_hub_favs') || '[]');
        let showFavoritesOnly = false;

        // DOM 元素引用
        const toolsGrid = document.getElementById('toolsGrid');
        const noResults = document.getElementById('noResults');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const categoryTags = document.getElementById('categoryTags');
        const favCount = document.getElementById('favCount');
        const favoriteToggleBtn = document.getElementById('favoriteToggleBtn');

        // 初始化页面
        function init() {
            updateFavCount();
            renderTools();
            bindEvents();
        }

        // 绑定事件处理
        function bindEvents() {
            // 搜索框输入事件
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim().toLowerCase();
                clearSearchBtn.classList.toggle('hidden', searchQuery === '');
                renderTools();
            });

            // 清除搜索按钮
            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                clearSearchBtn.classList.add('hidden');
                renderTools();
            });

            // 分类标签点击
            categoryTags.addEventListener('click', (e) => {
                const btn = e.target.closest('.tag-btn');
                if (!btn) return;

                // 退出“仅看收藏”状态
                showFavoritesOnly = false;
                favoriteToggleBtn.classList.remove('border-amber-500/50', 'bg-amber-500/10');

                // 切换样式
                document.querySelectorAll('.tag-btn').forEach(b => {
                    b.classList.remove('tag-active');
                    b.classList.add('text-slate-400');
                });
                btn.classList.add('tag-active');
                btn.classList.remove('text-slate-400');

                currentCategory = btn.dataset.category;
                renderTools();
            });

            // 我的收藏按钮切换
            favoriteToggleBtn.addEventListener('click', () => {
                showFavoritesOnly = !showFavoritesOnly;
                
                if (showFavoritesOnly) {
                    favoriteToggleBtn.classList.add('border-amber-500/50', 'bg-amber-500/10');
                    // 清除分类的高亮
                    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('tag-active'));
                } else {
                    favoriteToggleBtn.classList.remove('border-amber-500/50', 'bg-amber-500/10');
                    // 还原到“全部”标签
                    document.querySelector('[data-category="all"]').classList.add('tag-active');
                    currentCategory = 'all';
                }
                renderTools();
            });
        }

        // 渲染卡片列表
        function renderTools() {
            const filtered = toolsData.filter(tool => {
                // 分类匹配
                const matchesCategory = showFavoritesOnly ? true : (currentCategory === 'all' || tool.category === currentCategory);
                // 搜索匹配 (名字, 描述, 分类)
                const matchesSearch = tool.name.toLowerCase().includes(searchQuery) || 
                                     tool.desc.toLowerCase().includes(searchQuery);
                // 收藏匹配
                const matchesFav = showFavoritesOnly ? favorites.includes(tool.id) : true;

                return matchesCategory && matchesSearch && matchesFav;
            });

            // 渲染控制
            if (filtered.length === 0) {
                toolsGrid.innerHTML = '';
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                toolsGrid.innerHTML = filtered.map(tool => createCardHTML(tool)).join('');
            }
        }

        // 生成单张卡片 HTML
        function createCardHTML(tool) {
            const isFav = favorites.includes(tool.id);
            return `
                <div class="glass-card rounded-2xl p-5 flex flex-col justify-between relative group">
                    <div>
                        <!-- 卡片头部: 图标与收藏按钮 -->
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr ${tool.gradient} flex items-center justify-center text-white text-xl shadow-md">
                                <i class="fa-solid ${tool.icon}"></i>
                            </div>
                            <div class="flex items-center gap-2">
                                ${tool.badge ? `<span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30">${tool.badge}</span>` : ''}
                                <button onclick="toggleFavorite('${tool.id}')" class="text-slate-500 hover:text-amber-400 transition p-1 cursor-pointer">
                                    <i class="${isFav ? 'fa-solid text-amber-400' : 'fa-regular'} fa-bookmark text-lg"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 工具名称与描述 -->
                        <h3 class="text-lg font-bold text-white mb-2 group-hover:text-purple-300 transition flex items-center gap-2">
                            ${tool.name}
                        </h3>
                        <p class="text-slate-400 text-sm leading-relaxed mb-4 line-clamp-3">
                            ${tool.desc}
                        </p>
                    </div>

                    <!-- 卡片底部: 价格标签与访问按钮 -->
                    <div class="pt-4 border-t border-slate-700/50 flex items-center justify-between mt-auto">
                        <span class="text-xs text-slate-500 font-medium">
                            <i class="fa-solid fa-tag mr-1"></i>${tool.pricing}
                        </span>
                        <a href="${tool.url}" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-purple-600 text-slate-200 hover:text-white border border-slate-700 hover:border-purple-500 transition">
                            访问 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </div>
                </div>
            `;
        }

        // 切换收藏状态
        window.toggleFavorite = function(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('ai_hub_favs', JSON.stringify(favorites));
            updateFavCount();
            renderTools();
        };

        // 更新收藏数量显示
        function updateFavCount() {
            favCount.textContent = favorites.length;
        }

        // 初始化
        init();
    </script>
</body>
</html>
